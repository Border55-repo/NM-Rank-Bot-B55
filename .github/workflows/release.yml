name: Create release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build source package
        run: zip -qr "NM-Rank-Bot-B55-v${{ steps.version.outputs.version }}.zip" . -x '.git/*'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.version.outputs.version }}"
          "NM-Rank-Bot-B55-v${{ steps.version.outputs.version }}.zip"
          --title "NM-verktøy B55 v${{ steps.version.outputs.version }}"
          --notes-file "RELEASE_NOTES_v${{ steps.version.outputs.version }}.md"
